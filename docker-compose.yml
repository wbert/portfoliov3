version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: wbert/next-app:1.0.0
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    healthcheck:
      # BusyBox wget is available on Alpine-based images
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/ > /dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "81:81"
      # Uncomment if you add TLS (see note below)
      # - "443:443"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # If you want custom TLS certs later:
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    driver: bridge
