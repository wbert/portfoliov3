worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;

  # Useful proxy defaults
  proxy_http_version 1.1;
  proxy_set_header   Host $host;
  proxy_set_header   X-Real-IP $remote_addr;
  proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_set_header   Connection "";

  # Upstream to the Next.js server (from your Dockerfile: server.js runs at 3000)
  upstream next_app {
    server app:3000;
    keepalive 64;
  }

  server {
    listen 81;
    server_name _;

    # Optional: limit uploads (increase if you have large forms/uploads)
    client_max_body_size 10m;

    # Cache immutable assets aggressively
    location ~* \.(?:js|mjs|css|svg|png|jpg|jpeg|gif|ico|webp|avif|woff2?)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      proxy_pass http://next_app;
    }

    # Everything else -> Next.js
    location / {
      proxy_pass http://next_app;
    }
  }

  # TLS example (optional):
  # server {
  #   listen 443 ssl http2;
  #   server_name your.domain.tld;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   include             /etc/nginx/conf.d/ssl-params.conf;
  #   location / { proxy_pass http://next_app; }
  # }
}
